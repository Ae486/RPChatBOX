# backend/pyproject.toml
#
# Config carrier only (no [build-system] / [project]) — does NOT make `backend/`
# an installable package. Carries the mypy (T20) + ruff (T24) tooling baselines.
#
# Tooling policy: lenient curated rulesets that ratchet UP over time.
# See CONTRIBUTING "Type checking" for the ruleset philosophy, opt-out rules,
# and ratchet roadmap. Baselines are ADVISORY (non-blocking) until T21 flips CI.

[tool.mypy]
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# --- Curated baseline ruleset (high-value, low-noise) ---
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# --- Deferred ratchet targets (intentionally OFF at baseline) ---
# Ordered roughly by how soon they should be turned on. See CONTRIBUTING.
# check_untyped_defs      = true   # +272 errors at baseline (untyped bodies); enable first
# disallow_untyped_defs   = true
# disallow_any_generics   = true
# warn_return_any         = true
# strict                  = true

# --- Third-party libs without type stubs (deliberate per-module opt-outs) ---
# markitdown: optional doc-parsing dep, no stubs shipped.
# yaml: stubs live in types-PyYAML — install that to remove this opt-out (ratchet).
[[tool.mypy.overrides]]
module = ["markitdown.*", "yaml"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- ruff (T24 pre-commit lint baseline; advisory until T21 CI) ---
# Same philosophy as [tool.mypy]: lenient curated ruleset that ratchets UP.
[tool.ruff]
target-version = "py312"
line-length = 100

# Lint settings live under [tool.ruff.lint] (NOT top-level [tool.ruff]).
[tool.ruff.lint]
# Start high-signal / low-noise: E9 (runtime/syntax errors) + F (Pyflakes).
# Cosmetic E-rules (whitespace/line-length style) intentionally OFF — ratchet up later.
select = ["E9", "F"]
