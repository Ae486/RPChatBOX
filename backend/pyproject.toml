# backend/pyproject.toml
#
# Config carrier only (no [build-system] / [project]) — does NOT make `backend/`
# an installable package. Currently scoped to the mypy type-checking baseline (T20).
#
# Type-checking policy: lenient curated ruleset that ratchets UP over time.
# See CONTRIBUTING "Type checking" for the ruleset philosophy, opt-out rules,
# and ratchet roadmap. Baseline is ADVISORY (non-blocking) until T21 flips CI.

[tool.mypy]
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# --- Curated baseline ruleset (high-value, low-noise) ---
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# --- Deferred ratchet targets (intentionally OFF at baseline) ---
# Ordered roughly by how soon they should be turned on. See CONTRIBUTING.
# check_untyped_defs      = true   # +272 errors at baseline (untyped bodies); enable first
# disallow_untyped_defs   = true
# disallow_any_generics   = true
# warn_return_any         = true
# strict                  = true

# --- Third-party libs without type stubs (deliberate per-module opt-outs) ---
# markitdown: optional doc-parsing dep, no stubs shipped.
# yaml: stubs live in types-PyYAML — install that to remove this opt-out (ratchet).
[[tool.mypy.overrides]]
module = ["markitdown.*", "yaml"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
