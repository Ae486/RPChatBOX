name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Install test runner (pytest-xdist, bounded major; kept out of requirements.txt per T20 boundary)
        run: python -m pip install "pytest-xdist>=3,<4"
      - name: Install coverage runner (pytest-cov, bounded major; out of requirements.txt per T23/T20 boundary)
        run: python -m pip install "pytest-cov>=7,<8"
      - name: Ruff check (hard gate)
        run: python -m ruff check backend
      - name: RP service size lint (hard gate)
        run: python backend/rp/devtools/check_service_sizes.py
      - name: RP service import lint (hard gate)
        run: python backend/rp/devtools/check_service_imports.py
      - name: RP tests (hard gate)
        working-directory: backend
        run: python -m pytest -n auto rp
      - name: RP coverage (advisory)
        working-directory: backend
        continue-on-error: true
        run: python -m pytest -n auto rp --cov=rp --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Mypy (advisory)
        working-directory: backend
        continue-on-error: true
        run: python -m mypy rp
